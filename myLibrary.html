<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalimat – My Library</title>
  <link rel="stylesheet" href="bootstrap-5.3.7-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
  <link rel="stylesheet" href="css/kalimat-shared.css">
  <style>
    /* HEADER */
    .lib-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .lib-header h4 {
      margin: 0;
      font-size: .9rem;
      font-weight: 700;
      color: var(--brown-dark);
      background: var(--accent-soft);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    .lib-search {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 8px 14px;
      gap: 8px;
      flex: 1;
    }
    .lib-search i { color: var(--muted); }
    .lib-search input { border: none; background: none; outline: none; font-size: .9rem; color: var(--text); width: 100%; }
    .lib-search input::placeholder { color: var(--muted); font-size: .85rem; }

    /* SECTION */
    .shelf-section { margin-bottom: 2rem; }
    .shelf-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .75rem;
    }
    .shelf-title-row h3 { font-size: 1.05rem; font-weight: 700; color: var(--brown-dark); margin: 0; }
    .shelf-title-row a  { font-size: .82rem; color: var(--muted); text-decoration: none; cursor: pointer; }
    .shelf-title-row a:hover { color: var(--brown); }

    /* BOOK ROW */
    .shelf-books {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .shelf-books::-webkit-scrollbar { height: 3px; }
    .shelf-books::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    .book-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .book-wrap img,
    .main-books img {
      width: 70px !important;
      height: 100px !important;
      max-width: 70px !important;
      max-height: 100px !important;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 6px 4px 10px rgba(0,0,0,.25);
      transition: transform .2s;
      display: block;
    }

    .main-books {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .main-books:hover img { transform: translateY(-5px); }
    .book-wrap:hover img { transform: translateY(-5px); }

    /* Progress under book */
    .book-progress {
      width: 70px;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .book-progress .bar { height: 100%; background: var(--accent); border-radius: 3px; }

    /* SHELF LINE */
    .shelf-line {
      width: 100%;
      height: 14px;
      background: rgba(217,214,205,0.7);
      border-radius: 2px 2px 6px 6px;
      border-top: 4px solid rgb(229,228,218);
      box-shadow: 4px 4px 8px rgba(0,0,0,0.07);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

    </div>
    <ul class="sidebar-nav">
      <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>

  <!-- MAIN -->

    <!-- Next Up -->
    <div class="shelf-section">
      <div class="shelf-title-row">
        <h3>Next up</h3>
        <a>Full Shelf <i class="fas fa-chevron-right" style="font-size:.7rem"></i></a>
      </div>
      <div class="shelf-books shelve-section2">
        <div class="book-wrap" id="1"><img src="images/books/1984.jpg" alt=""></div>
        <div class="book-wrap" id="2"><img src="images/image3.jpeg" alt=""></div>
        <div class="book-wrap"><img src="images/books/image1.jpeg" alt=""></div>
        <div class="book-wrap"><img src="images/books/1984.jpg" alt=""></div>
        <div class="book-wrap"><img src="images/image3.jpeg" alt=""></div>
        <div class="book-wrap"><img src="images/books/image1.jpeg" alt=""></div>
      </div>
      <div class="shelf-line"></div>
    </div>

    <!-- Finished -->
    <div class="shelf-section">
      <div class="shelf-title-row">
        <h3>Finished</h3>
      </div>
      <div class="shelf-books shelve-section3">
        <!-- populated by library.js -->
      </div>
      <div class="shelf-line"></div>
    </div>

  </main>
</div>

<script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
<script src="javascript/library.js"></script>
<script src="javascript/kalimat-shared.js"></script>
